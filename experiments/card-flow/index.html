<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070B18">
<title>三件好事 · 卡牌社区 demo</title>
<script>if (location.hash.includes("debug")) { window.addEventListener("error", e => { document.title = "ERR: " + e.message; }); }</script>
<style>
  :root{
    --bg0:#05070F; --bg1:#0B1526;
    --ink:#F3EDE3; --ink-dim:#A79F93;
    --gold:#FFC978; --gold2:#FFA95C;
    --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.1);
    --line:rgba(255,255,255,.14);
    --shadow:rgba(0,0,0,.55);
    --mint:#63E0D2; --violet:#6D7CFF;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1100px 800px at 15% 0%, rgba(109,124,255,.24), transparent 60%),
      radial-gradient(1000px 760px at 88% 100%, rgba(255,157,92,.18), transparent 58%),
      linear-gradient(165deg, var(--bg1), var(--bg0) 60%);
    -webkit-font-smoothing:antialiased;user-select:none;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(120% 92% at 50% 40%, transparent 40%, rgba(2,4,10,.6) 100%)}
  .glass{
    background:var(--glass);border:1px solid var(--line);border-radius:24px;
    backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);
    box-shadow:0 30px 90px var(--shadow), inset 0 1px 0 rgba(255,255,255,.1);
  }

  /* ===== 视图切换 ===== */
  .view{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;transition:opacity .6s ease, visibility .6s}
  .view.active{opacity:1;visibility:visible}
  html.still .view,html.still .card-inner,html.still .card,html.still #shootCard{transition:none!important}

  /* ===== 顶栏 ===== */
  .topbar{position:fixed;top:20px;left:26px;right:26px;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:14px;pointer-events:none}
  .topbar > *{pointer-events:auto}
  .brand{font-size:12.5px;letter-spacing:.14em;color:var(--ink);opacity:.9}
  .brand .sub{font-size:10.5px;letter-spacing:.04em;color:var(--ink-dim);margin-left:10px}
  .steps{display:flex;gap:6px;padding:5px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .step{padding:7px 14px;border-radius:999px;font-size:11.5px;letter-spacing:.08em;color:var(--ink-dim);transition:all .3s}
  .step.on{color:#241708;background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 8px 22px rgba(255,170,90,.25)}

  /* ===== 1. 写三条 ===== */
  .write-card{width:min(430px,90vw);padding:30px 26px 24px;position:relative;z-index:2}
  .write-card .date{margin:0 0 6px;font-size:11px;letter-spacing:.3em;color:var(--gold);text-indent:.3em}
  .write-card h1{margin:0 0 18px;font-size:22px;font-weight:400;letter-spacing:.08em}
  .line{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px dashed var(--line)}
  .line:last-of-type{border-bottom:0}
  .line .n{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--gold)}
  .line input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:14.5px}
  .line input::placeholder{color:var(--ink-dim)}
  .line:focus-within .n{border-color:var(--gold);box-shadow:0 0 14px rgba(255,201,120,.35)}
  .primary{
    margin-top:22px;width:100%;height:52px;border:0;border-radius:16px;cursor:pointer;
    font-size:15px;letter-spacing:.2em;text-indent:.2em;color:#241708;
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    box-shadow:0 16px 44px rgba(255,170,90,.28);transition:transform .25s ease, box-shadow .25s ease;
  }
  .primary:hover{transform:translateY(-1px);box-shadow:0 20px 54px rgba(255,170,90,.38)}
  .primary:active{transform:scale(.985)}
  .hint{font-size:11.5px;color:var(--ink-dim);text-align:center;margin-top:12px;letter-spacing:.06em}

  /* ===== 2. 投篮 ===== */
  .shoot-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .hoop{width:min(400px,52vh);position:relative;z-index:2;transform:translateY(-100px);filter:drop-shadow(0 30px 60px rgba(0,0,0,.45))}
  .hoop svg{display:block;width:100%;height:auto;overflow:visible}
  .shoot-card{
    position:absolute;z-index:6;left:50%;bottom:17vh;width:150px;height:200px;
    border-radius:14px;cursor:grab;touch-action:none;
    transform:translate(-50%,0);
    transition:transform .45s cubic-bezier(.2,.9,.25,1);
    will-change:transform;
  }
  .shoot-card.dragging{cursor:grabbing;transition:none}
  .shoot-card .mini{
    width:100%;height:100%;border-radius:14px;overflow:hidden;
    background:#FFFDF7;border:1px solid #EADFCB;
    box-shadow:0 26px 60px rgba(0,0,0,.5);
    padding:14px 14px 12px;display:flex;flex-direction:column;gap:7px;
  }
  .mini .mh{font-size:9px;letter-spacing:.22em;color:#B08A4F}
  .mini .mi{display:flex;gap:6px;align-items:flex-start;font-size:10.5px;line-height:1.4;color:#3A3128}
  .mini .mi i{flex:0 0 auto;width:4px;height:4px;border-radius:50%;background:#C08A44;margin-top:5px}
  .mini .mfoot{margin-top:auto;font-size:8.5px;letter-spacing:.16em;color:#B08A4F;text-align:right}
  .shoot-tip{position:absolute;left:50%;bottom:13vh;transform:translateX(-50%);
    font-size:11.5px;letter-spacing:.22em;text-indent:.22em;color:var(--ink-dim);white-space:nowrap;z-index:6}
  .auto-btn{
    position:absolute;left:50%;bottom:6vh;transform:translateX(-50%);z-index:6;
    padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:var(--glass);
    color:var(--ink-dim);font-size:11.5px;letter-spacing:.14em;cursor:pointer;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:all .25s;
  }
  .auto-btn:hover{color:var(--gold);border-color:var(--gold)}
  .fx-canvas{position:absolute;inset:0;z-index:5;pointer-events:none;width:100%;height:100%}
  .score-pop{position:absolute;z-index:7;left:50%;top:26%;transform:translate(-50%,10px);
    font-size:13px;letter-spacing:.24em;color:var(--gold);opacity:0;transition:opacity .4s, transform .4s}
  .score-pop.show{opacity:1;transform:translate(-50%,0)}

  /* ===== 3. 卡池 ===== */
  .wall-wrap{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding:92px 26px 88px}
  .wall-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;max-width:1120px;width:100%;margin:0 auto 16px}
  .wall-head h2{margin:0;font-size:20px;font-weight:400;letter-spacing:.1em}
  .wall-head .cnt{font-size:11.5px;letter-spacing:.14em;color:var(--ink-dim);margin-top:6px}
  .wall-grid{
    flex:1;overflow:auto;max-width:1120px;width:100%;margin:0 auto;
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;
    align-content:start;padding:4px 2px 20px;scrollbar-width:none;
  }
  .wall-grid::-webkit-scrollbar{display:none}
  .wall-foot{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;display:flex;gap:10px;align-items:center}
  .ghost{
    padding:9px 20px;border-radius:999px;border:1px solid var(--line);background:var(--glass);
    color:var(--ink-dim);font-size:12px;letter-spacing:.14em;cursor:pointer;transition:all .25s;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .ghost:hover{color:var(--gold);border-color:var(--gold)}

  /* ===== 卡牌 ===== */
  .card{position:relative;aspect-ratio:3/4.2;perspective:1100px;cursor:pointer;opacity:0;transform:translateY(26px) rotate(-2deg)}
  html.still .card{opacity:1;transform:none}
  .card.enter{opacity:1;transform:none;transition:opacity .7s ease, transform .8s cubic-bezier(.2,.9,.25,1)}
  .card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.2,.9,.25,1);border-radius:14px}
  .card.flipped .card-inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.4)}
  .face.back{display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.22)}
  .face.back::after{content:"";position:absolute;inset:8px;border:1px solid rgba(255,255,255,.34);border-radius:10px;pointer-events:none}
  .face.front{
    transform:rotateY(180deg);background:#FFFDF7;border:1px solid #EADFCB;
    padding:14px 13px 12px;display:flex;flex-direction:column;color:#3A3128;
  }
  .front .fdate{font-size:8.5px;letter-spacing:.2em;color:#B08A4F}
  .front ul{list-style:none;margin:9px 0 0;padding:0}
  .front li{position:relative;padding-left:11px;font-size:10.5px;line-height:1.45;margin-bottom:6px}
  .front li::before{content:"";position:absolute;left:0;top:5px;width:3.5px;height:3.5px;border-radius:50%;background:#C08A44}
  .front .fauthor{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:8.5px;letter-spacing:.08em;color:#A8895F}
  .front .star{font-size:9px;color:#C08A44}
  .tag-new{position:absolute;top:8px;left:8px;z-index:2;font-size:8px;letter-spacing:.14em;color:#241708;
    background:linear-gradient(135deg,var(--gold),var(--gold2));padding:3px 7px;border-radius:999px}
  .back-deco{position:absolute;inset:0;opacity:.5}

  @media (max-width:820px){
    .wall-wrap{padding:80px 16px 82px}
    .wall-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .brand .sub{display:none}
    .step{padding:6px 10px;font-size:10.5px}
  }
  @media (max-width:520px){
    .wall-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">三件好事 <span class="sub">卡牌社区 demo v0.1</span></div>
  <div class="steps">
    <span class="step" data-step="write">① 写三条</span>
    <span class="step" data-step="shoot">② 投篮</span>
    <span class="step" data-step="wall">③ 卡池</span>
  </div>
</header>

<!-- ============ 1. 写 ============ -->
<section class="view active" id="view-write">
  <div class="write-card glass">
    <p class="date">2026年11月16日 · 周一</p>
    <h1>今天的三件好事</h1>
    <label class="line"><span class="n">1</span><input value="食堂阿姨多给了一勺菜，还冲我笑了一下" /></label>
    <label class="line"><span class="n">2</span><input value="和室友把卡了两天的 bug 弄通了" /></label>
    <label class="line"><span class="n">3</span><input value="晚上去操场走了两圈，风很凉" /></label>
    <button class="primary" id="toShoot">写好了 · 去投篮</button>
    <p class="hint">写满三条，投进篮筐，这张卡就会进卡池</p>
  </div>
</section>

<!-- ============ 2. 投 ============ -->
<section class="view" id="view-shoot">
  <div class="shoot-stage">
    <div class="hoop">
      <svg viewBox="0 0 360 320" id="hoopSvg">
        <!-- 篮板 -->
        <rect x="60" y="18" width="240" height="150" rx="14" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
        <rect x="128" y="66" width="104" height="66" rx="4" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2" stroke-dasharray="7 7"/>
        <!-- 篮圈 -->
        <g id="rimGroup">
          <ellipse cx="180" cy="182" rx="52" ry="13" fill="none" stroke="#F08A4B" stroke-width="5"/>
          <path d="M128 182 q52 22 104 0" fill="none" stroke="#F08A4B" stroke-width="5" opacity=".55"/>
        </g>
        <!-- 网 -->
        <g id="net" stroke="rgba(255,255,255,.72)" stroke-width="1.6" fill="none">
          <path d="M132 186 L152 268 M180 195 L180 274 M228 186 L208 268"/>
          <path d="M140 210 Q180 222 220 210"/>
          <path d="M146 232 Q180 244 214 232"/>
          <path d="M154 254 Q180 264 206 254"/>
          <path d="M132 186 L208 268 M228 186 L152 268" opacity=".5"/>
        </g>
        <circle id="rimCenter" cx="180" cy="188" r="1" fill="transparent"/>
      </svg>
    </div>
  </div>
  <canvas class="fx-canvas" id="fx"></canvas>
  <div class="shoot-card" id="shootCard"></div>
  <p class="shoot-tip">把卡拖进篮筐</p>
  <button class="auto-btn" id="autoShoot">我手不稳 · 自动投</button>
  <div class="score-pop" id="scorePop">投进了 · 第 <b id="scoreN">13</b> 张</div>
</section>

<!-- ============ 3. 卡池 ============ -->
<section class="view" id="view-wall">
  <div class="wall-wrap">
    <div class="wall-head">
      <div>
        <h2>卡池</h2>
        <div class="cnt" id="wallCount">已收集 12 张 · 点卡片翻开</div>
      </div>
    </div>
    <div class="wall-grid" id="wallGrid"></div>
  </div>
  <div class="wall-foot">
    <button class="ghost" id="newCard">＋ 再写一张</button>
  </div>
</section>

<script>
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- 卡背小动物（原创 SVG，后续可整组替换） ---------- */
  const c = "#3B2F2A";
  const BACKS = [
    { g1: "#FFE3B8", g2: "#FFC98A", face: `
      <path d="M22 30 L14 12 L34 22 Z" fill="#FFF6E6" stroke="${c}" stroke-width="3" stroke-linejoin="round"/>
      <path d="M58 30 L66 12 L46 22 Z" fill="#FFF6E6" stroke="${c}" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="40" cy="40" r="21" fill="#FFF6E6" stroke="${c}" stroke-width="3"/>
      <circle cx="32" cy="38" r="2.6" fill="${c}"/><circle cx="48" cy="38" r="2.6" fill="${c}"/>
      <path d="M36 46 q4 4 8 0" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M14 40 L24 42 M14 48 L24 47 M66 40 L56 42 M66 48 L56 47" stroke="${c}" stroke-width="2" stroke-linecap="round" opacity=".7"/>` },
    { g1: "#CFE3FF", g2: "#A9CBFF", face: `
      <ellipse cx="22" cy="42" rx="9" ry="16" fill="#EDF4FF" stroke="${c}" stroke-width="3" transform="rotate(-16 22 42)"/>
      <ellipse cx="58" cy="42" rx="9" ry="16" fill="#EDF4FF" stroke="${c}" stroke-width="3" transform="rotate(16 58 42)"/>
      <circle cx="40" cy="40" r="20" fill="#EDF4FF" stroke="${c}" stroke-width="3"/>
      <circle cx="33" cy="37" r="2.5" fill="${c}"/><circle cx="47" cy="37" r="2.5" fill="${c}"/>
      <ellipse cx="40" cy="47" rx="8" ry="6" fill="#FFF" stroke="${c}" stroke-width="2"/>
      <ellipse cx="40" cy="44" rx="3" ry="2.2" fill="${c}"/>` },
    { g1: "#D7F0DC", g2: "#BFE3C8", face: `
      <circle cx="40" cy="38" r="20" fill="#F4FBF5" stroke="${c}" stroke-width="3"/>
      <circle cx="30" cy="24" r="7" fill="#F4FBF5" stroke="${c}" stroke-width="3"/>
      <circle cx="50" cy="24" r="7" fill="#F4FBF5" stroke="${c}" stroke-width="3"/>
      <circle cx="31" cy="38" r="2.6" fill="${c}"/><circle cx="49" cy="38" r="2.6" fill="${c}"/>
      <path d="M28 47 q12 9 24 0" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/>
      <ellipse cx="24" cy="47" rx="3.4" ry="2.2" fill="#F3A6A6" opacity=".8"/>
      <ellipse cx="56" cy="47" rx="3.4" ry="2.2" fill="#F3A6A6" opacity=".8"/>` },
    { g1: "#FFD9E1", g2: "#FFB7C5", face: `
      <ellipse cx="28" cy="20" rx="6" ry="15" fill="#FFF2F5" stroke="${c}" stroke-width="3"/>
      <ellipse cx="52" cy="20" rx="6" ry="15" fill="#FFF2F5" stroke="${c}" stroke-width="3"/>
      <circle cx="40" cy="40" r="20" fill="#FFF5F7" stroke="${c}" stroke-width="3"/>
      <circle cx="33" cy="38" r="2.5" fill="${c}"/><circle cx="47" cy="38" r="2.5" fill="${c}"/>
      <ellipse cx="40" cy="46" rx="3" ry="2.4" fill="#E8899C"/>
      <path d="M34 50 q6 5 12 0" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"/>` },
    { g1: "#E6DBFF", g2: "#C9B4FF", face: `
      <circle cx="27" cy="24" r="8" fill="#F5F0FF" stroke="${c}" stroke-width="3"/>
      <circle cx="53" cy="24" r="8" fill="#F5F0FF" stroke="${c}" stroke-width="3"/>
      <circle cx="40" cy="40" r="21" fill="#F5F0FF" stroke="${c}" stroke-width="3"/>
      <circle cx="33" cy="39" r="2.6" fill="${c}"/><circle cx="47" cy="39" r="2.6" fill="${c}"/>
      <ellipse cx="40" cy="47" rx="6.5" ry="5" fill="#FFF" stroke="${c}" stroke-width="2"/>
      <ellipse cx="40" cy="44.5" rx="2.6" ry="2" fill="${c}"/>` },
    { g1: "#FFE9C9", g2: "#FFD08A", face: `
      <circle cx="40" cy="40" r="21" fill="#FFF8EC" stroke="${c}" stroke-width="3"/>
      <circle cx="32" cy="37" r="2.6" fill="${c}"/><circle cx="48" cy="37" r="2.6" fill="${c}"/>
      <path d="M40 43 L35 49 L45 49 Z" fill="#F6A55C" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"/>
      <ellipse cx="24" cy="45" rx="3.4" ry="2.2" fill="#F3A6A6" opacity=".85"/>
      <ellipse cx="56" cy="45" rx="3.4" ry="2.2" fill="#F3A6A6" opacity=".85"/>` }
  ];
  function backSVG(i) {
    const b = BACKS[i % BACKS.length];
    return `<svg viewBox="0 0 80 80" width="64%" height="auto">${b.face}</svg>`;
  }

  /* ---------- 数据 ---------- */
  const OTHERS = [
    { author: "小鹿", date: "11月15日 周日", items: ["睡到自然醒", "妈妈寄的围巾到了", "晚霞很好看"] },
    { author: "番茄", date: "11月15日 周日", items: ["抢到演唱会门票", "楼下新开的面馆好吃", "和猫对视了三秒"] },
    { author: "阿北", date: "11月14日 周六", items: ["把房间收拾干净", "看完一部老电影", "散步遇到一只狗"] },
    { author: "momo", date: "11月14日 周六", items: ["雅思听力全对", "食堂排到了最后一份鱼", "朋友说想我了"] },
    { author: "老白", date: "11月13日 周五", items: ["实验终于跑通", "室友煮了面", "把 to-do 清掉一半"] },
    { author: "柚子", date: "11月13日 周五", items: ["睡了个好觉", "耳机里随机到很喜欢的歌", "发现窗台的植物冒新芽"] },
    { author: "小满", date: "11月12日 周四", items: ["被老师夸了一句", "路上买到了热乎乎的烤红薯", "把想说的话说出口了"] },
    { author: "阿蓝", date: "11月12日 周四", items: ["把拖了三天的邮件写完", "午后的太阳很好", "晚饭吃到了最喜欢的菜"] },
    { author: "橘子", date: "11月11日 周三", items: ["和朋友视频聊了很久", "把衣服都晒了", "学会了一个新和弦"] },
    { author: "L", date: "11月11日 周三", items: ["图书馆占到靠窗位", "被陌生人让了座", "晚上看到星星"] },
    { author: "小树", date: "11月10日 周二", items: ["把没看完的书看完", "跑了三公里", "喝到一杯很好喝的咖啡"] }
  ];
  const myCard = () => ({
    author: "你",
    date: "11月16日 周一",
    items: $$("#view-write .line input").map(i => i.value.trim()).filter(Boolean)
  });
  let collection = OTHERS.slice();
  let total = collection.length;

  /* ---------- 视图 ---------- */
  const views = { write: "#view-write", shoot: "#view-shoot", wall: "#view-wall" };
  let current = "write";
  function show(name) {
    if (!views[name]) name = "write";
    current = name;
    $$(".view").forEach(v => v.classList.toggle("active", "#" + v.id === views[name]));
    $$(".step").forEach(s => s.classList.toggle("on", s.dataset.step === name));
    if (history.replaceState) history.replaceState(null, "", "#" + name);
    if (name === "wall") renderWall();
    if (name === "shoot") resetShoot();
  }
  $$(".step").forEach(s => s.addEventListener("click", () => show(s.dataset.step)));
  $("#toShoot").addEventListener("click", () => show("shoot"));
  $("#newCard").addEventListener("click", () => show("write"));

  /* ================= 投篮 ================= */
  const shoot = {
    dragging: false, sx: 0, sy: 0, dx: 0, dy: 0, flying: false,
    cardEl: null, fx: null, ctx: null, ps: [], sprite: null, netPhase: 0, netT: -1,
    init() {
      this.cardEl = $("#shootCard");
      this.fx = $("#fx");
      this.ctx = fit(this.fx);
      this.cardEl.innerHTML = miniCardHTML(myCardPreview());
      this.makeSprite();
      this.bindDrag();
    },
    makeSprite() {
      const s = 96, cv = document.createElement("canvas");
      cv.width = cv.height = s;
      const g = cv.getContext("2d");
      const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
      gr.addColorStop(0, "rgba(255,239,205,.95)");
      gr.addColorStop(.35, "rgba(255,214,150,.5)");
      gr.addColorStop(1, "rgba(255,214,150,0)");
      g.fillStyle = gr; g.fillRect(0, 0, s, s);
      this.sprite = cv;
    },
    bindDrag() {
      const el = this.cardEl;
      const onDown = e => {
        if (this.flying) return;
        el.setPointerCapture?.(e.pointerId);
        this.dragging = true;
        this.sx = e.clientX; this.sy = e.clientY;
        this.dx = 0; this.dy = 0;
        el.classList.add("dragging");
      };
      const onMove = e => {
        if (!this.dragging) return;
        this.dx = e.clientX - this.sx;
        this.dy = e.clientY - this.sy;
        el.style.transform = `translate(-50%,0) translate(${this.dx}px,${this.dy}px) rotate(${this.dx * .08}deg)`;
      };
      const onUp = () => {
        if (!this.dragging) return;
        this.dragging = false;
        el.classList.remove("dragging");
        if (this.dy < -90) this.launch();
        else el.style.transform = "translate(-50%,0)";
      };
      el.addEventListener("pointerdown", onDown);
      el.addEventListener("pointermove", onMove);
      el.addEventListener("pointerup", onUp);
      el.addEventListener("pointercancel", onUp);
      $("#autoShoot").addEventListener("click", () => {
        if (!this.flying) { el.style.transform = "translate(-50%,0)"; this.launch(); }
      });
    },
    launch() {
      if (this.flying) return;
      this.flying = true;
      const card = this.cardEl;
      const cr = card.getBoundingClientRect();
      const rim = $("#rimCenter").getBoundingClientRect();
      const p0 = { x: cr.left + cr.width / 2, y: cr.top + cr.height / 2 };
      const p2 = { x: rim.left + rim.width / 2, y: rim.top + rim.height / 2 };
      const p1 = { x: (p0.x + p2.x) / 2 + 40, y: p0.y - (p0.y - p2.y) * .55 - 140 };
      const t0 = performance.now();
      const dur = 820;
      const step = now => {
        const t = clamp((now - t0) / dur, 0, 1);
        const e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        const x = (1 - e) * (1 - e) * p0.x + 2 * (1 - e) * e * p1.x + e * e * p2.x;
        const y = (1 - e) * (1 - e) * p0.y + 2 * (1 - e) * e * p1.y + e * e * p2.y;
        card.style.transform = `translate(-50%,0) translate(${(x - p0.x).toFixed(1)}px,${(y - p0.y).toFixed(1)}px) rotate(${(720 * e).toFixed(0)}deg) scale(${(1 - .22 * e).toFixed(3)})`;
        this.spawnSpark(x, y);
        this.drawFx();
        if (t > .9 && !this._swished) { this._swished = true; this.swish(); }
        if (t < 1) requestAnimationFrame(step);
        else setTimeout(() => {
          this.flying = false; this._swished = false;
          card.style.transition = "none";
          card.style.opacity = "0";
          setTimeout(() => { card.style.transition = ""; card.style.opacity = ""; card.style.transform = "translate(-50%,0)"; }, 60);
          collection.unshift(myCard());
          total += 1;
          $("#scoreN").textContent = total;
          $("#scorePop").classList.add("show");
          setTimeout(() => { $("#scorePop").classList.remove("show"); show("wall"); }, 900);
        }, 120);
      };
      requestAnimationFrame(step);
    },
    spawnSpark(x, y) {
      if (RM) return;
      for (let i = 0; i < 3; i++) {
        this.ps.push({
          x: x + (Math.random() - .5) * 26,
          y: y + (Math.random() - .5) * 26,
          vx: (Math.random() - .5) * 60, vy: (Math.random() - .5) * 60 + 10,
          age: 0, life: .6 + Math.random() * .5, r: 2 + Math.random() * 4
        });
      }
    },
    burst(x, y, n = 46) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 260;
        this.ps.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, age: 0, life: .5 + Math.random() * .6, r: 2 + Math.random() * 5 });
      }
    },
    swish() {
      const rim = $("#rimCenter").getBoundingClientRect();
      const cvr = this.fx.getBoundingClientRect();
      this.burst(rim.left + rim.width / 2 - cvr.left, rim.top + rim.height / 2 - cvr.top);
      this.netT = performance.now();
      sound.swish();
    },
    frameNet(now) {
      const net = $("#net");
      if (this.netT < 0) { net.style.transform = ""; return; }
      const t = (now - this.netT) / 1000;
      if (t > 1) { this.netT = -1; net.style.transform = ""; return; }
      const k = Math.exp(-2.4 * t) * Math.sin(t * 16);
      net.style.transformOrigin = "180px 188px";
      net.style.transform = `translateY(${(7 * k).toFixed(2)}px) scaleY(${(1 + .2 * k).toFixed(3)})`;
    },
    drawFx() {
      const c = this.ctx, cv = this.fx;
      if (!c) return;
      c.clearRect(0, 0, cv._w, cv._h);
      for (let i = this.ps.length - 1; i >= 0; i--) {
        const p = this.ps[i];
        p.age += 1 / 60;
        if (p.age > p.life) { this.ps.splice(i, 1); continue; }
        p.x += p.vx / 60; p.y += p.vy / 60;
        p.vx *= .97; p.vy *= .97;
        const a = 1 - p.age / p.life;
        c.globalAlpha = a * .9;
        const s = p.r * 8;
        c.drawImage(this.sprite, p.x - s / 2, p.y - s / 2, s, s);
      }
      c.globalAlpha = 1;
      this.frameNet(performance.now());
    }
  };

  function fit(cv) {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    cv._w = r.width || innerWidth; cv._h = r.height || innerHeight;
    const ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return ctx;
  }

  function miniCardHTML(items) {
    return `<div class="mini">
      <div class="mh">THREE GOOD THINGS</div>
      ${items.map(t => `<div class="mi"><i></i><span>${escapeHtml(t)}</span></div>`).join("")}
      <div class="mfoot">11 · 16</div>
    </div>`;
  }
  function myCardPreview() {
    const v = $$("#view-write .line input").map(i => i.value.trim()).filter(Boolean);
    return v.length ? v : ["写下一件好事…"];
  }

  function resetShoot() {
    shoot.flying = false;
    shoot.ps = [];
    if (shoot.ctx) shoot.ctx.clearRect(0, 0, shoot.fx._w, shoot.fx._h);
    shoot.cardEl.style.transform = "translate(-50%,0)";
    shoot.cardEl.innerHTML = miniCardHTML(myCardPreview());
    $("#scorePop").classList.remove("show");
  }

  /* ================= 卡池 ================= */
  function cardHTML(data, i, isNew) {
    const b = BACKS[i % BACKS.length];
    return `<div class="card" data-i="${i}">
      ${isNew ? '<span class="tag-new">刚投进</span>' : ""}
      <div class="card-inner">
        <div class="face back" style="background:linear-gradient(145deg,${b.g1},${b.g2})">
          <div class="back-deco" style="background-image:radial-gradient(rgba(255,255,255,.55) 1px, transparent 1px);background-size:14px 14px"></div>
          ${backSVG(i)}
        </div>
        <div class="face front">
          <div class="fdate">${data.date}</div>
          <ul>${data.items.map(t => `<li>${escapeHtml(t)}</li>`).join("")}</ul>
          <div class="fauthor"><span>@${escapeHtml(data.author)}</span><span class="star">★</span></div>
        </div>
      </div>
    </div>`;
  }
  function renderWall() {
    const grid = $("#wallGrid");
    grid.innerHTML = collection.map((d, i) => cardHTML(d, i, i === 0 && d.author === "你")).join("");
    $("#wallCount").textContent = `已收集 ${collection.length} 张 · 点卡片翻开`;
    const cards = $$(".card", grid);
    cards.forEach((el, i) => {
      if (RM) { el.classList.add("enter"); return; }
      el.style.transitionDelay = `${Math.min(i, 14) * 45}ms`;
      requestAnimationFrame(() => el.classList.add("enter"));
    });
    cards.forEach(el => el.addEventListener("click", () => {
      el.classList.toggle("flipped");
      sound.flip();
    }));
  }

  /* ================= 声音 ================= */
  let AC = null;
  const sound = {
    ctx() {
      try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); return AC; } catch (e) { return null; }
    },
    tone(f, d, gain, type = "sine") {
      const a = this.ctx(); if (!a) return;
      const t0 = a.currentTime + d;
      const o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(gain, t0 + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + .5);
      o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + .55);
    },
    flip() { this.tone(1180, 0, .035, "triangle"); this.tone(1760, .03, .02, "sine"); },
    swish() {
      const a = this.ctx(); if (!a) return;
      const len = Math.floor(a.sampleRate * .45);
      const buf = a.createBuffer(1, len, a.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4);
      const src = a.createBufferSource(); src.buffer = buf;
      const bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1500; bp.Q.value = .8;
      const g = a.createGain(); g.gain.value = .05;
      src.connect(bp).connect(g).connect(a.destination); src.start();
      this.tone(660, .04, .03); this.tone(990, .1, .025);
    }
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }

  /* ================= 启动 ================= */
  shoot.init();
  addEventListener("resize", () => { shoot.ctx = fit(shoot.fx); });

  const hashParts = (location.hash || "#write").slice(1).split("&");
  const still = hashParts.includes("still");
  if (still) document.documentElement.classList.add("still");
  const start = hashParts[0] || "write";
  show(["shoot", "wall"].includes(start) ? start : "write");

  /* 截图/演示辅助：&flip=2 直接翻开第 3 张；&frozen=0.6 定格飞行中的卡 */
  const flipArg = hashParts.find(p => p.startsWith("flip="));
  if (start === "wall" && flipArg) {
    const idx = parseInt(flipArg.split("=")[1], 10) || 0;
    const el = $$(".card")[idx];
    if (el) el.classList.add("flipped");
  }
  const frozenArg = hashParts.find(p => p.startsWith("frozen="));
  if (start === "shoot" && frozenArg && !RM) {
    const f = clamp(parseFloat(frozenArg.split("=")[1]) || .6, 0, 1);
    const card = shoot.cardEl;
    const cr = card.getBoundingClientRect();
    const rim = $("#rimCenter").getBoundingClientRect();
    const p0 = { x: cr.left + cr.width / 2, y: cr.top + cr.height / 2 };
    const p2 = { x: rim.left + rim.width / 2, y: rim.top + rim.height / 2 };
    const p1 = { x: (p0.x + p2.x) / 2 + 40, y: p0.y - (p0.y - p2.y) * .55 - 140 };
    const e = f;
    const x = (1 - e) * (1 - e) * p0.x + 2 * (1 - e) * e * p1.x + e * e * p2.x;
    const y = (1 - e) * (1 - e) * p0.y + 2 * (1 - e) * e * p1.y + e * e * p2.y;
    card.style.transform = `translate(-50%,0) translate(${(x - p0.x).toFixed(1)}px,${(y - p0.y).toFixed(1)}px) rotate(${(720 * e).toFixed(0)}deg) scale(${(1 - .22 * e).toFixed(3)})`;
    const fr = shoot.fx.getBoundingClientRect();
    for (let i = 0; i < 60; i++) {
      const tt = (i / 60) * f;
      const xx = (1 - tt) * (1 - tt) * p0.x + 2 * (1 - tt) * tt * p1.x + tt * tt * p2.x;
      const yy = (1 - tt) * (1 - tt) * p0.y + 2 * (1 - tt) * tt * p1.y + tt * tt * p2.y;
      shoot.ps.push({ x: xx - fr.left, y: yy - fr.top, vx: 0, vy: 0, age: 0, life: 9, r: 2 + Math.random() * 3 });
    }
    shoot.drawFx();
  }
})();
</script>
</body>
