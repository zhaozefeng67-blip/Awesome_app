<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEFF2">
<title>三件好事 · 投篮收卡 demo</title>
<script>if (location.hash.includes("debug")) { window.addEventListener("error", e => { document.title = "ERR: " + e.message; }); }</script>
<style>
  :root{
    --page:#EDEFF2; --app:#FFFFFF;
    --ink:#16181D; --sub:#8B9099; --line:#E6E8EC; --dash:#C6CBD2;
    --orange:#F0652B; --orange-2:#FF8A4C; --orange-soft:#FFEDE3; --orange-zone:#FDF1EA;
    --shadow:0 18px 50px rgba(22,24,29,.10); --shadow-sm:0 6px 18px rgba(22,24,29,.07);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--page);-webkit-font-smoothing:antialiased;user-select:none;
    display:flex;align-items:center;justify-content:center;padding:18px;
  }
  .app{position:relative;width:min(460px,100%);height:min(840px,calc(100vh - 36px));
    background:var(--app);border-radius:30px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
  @media (max-width:520px){ body{padding:0;background:var(--app)} .app{width:100%;height:100dvh;border-radius:0;box-shadow:none} }
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:26px 26px 14px}
  .head h1{margin:0;font-size:27px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
  .head .sub{margin:7px 0 0;font-size:13.5px;color:var(--sub);line-height:1.5}
  .pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
    background:#F1F2F4;border:1px solid #E9EAEE;font-size:12px;color:#6B7078;white-space:nowrap}
  .pill b{color:var(--ink);font-size:13px}
  .main{position:relative;flex:1;min-height:0}
  .view{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    padding:6px 26px 22px;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
  .view.active{opacity:1;visibility:visible}
  html.still .view,html.still .file-card,html.still .card-inner,html.still .bar i,html.still .card{transition:none!important;animation:none!important}

  /* ============ 1. 写 ============ */
  .sheet{width:100%;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-sm);padding:8px 18px;margin-top:6px}
  .row{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid #F0F1F4}
  .row:last-child{border-bottom:0}
  .row .n{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--orange-soft);color:var(--orange);
    display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600}
  .row input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:15px;color:var(--ink)}
  .row input::placeholder{color:#B6BAC1}
  .btn{width:100%;height:52px;border:0;border-radius:15px;cursor:pointer;margin-top:auto;
    background:var(--orange);color:#fff;font-size:15px;font-weight:600;letter-spacing:.06em;
    box-shadow:0 12px 26px rgba(240,101,43,.28);transition:transform .2s ease,box-shadow .2s ease}
  .btn:hover{transform:translateY(-1px);box-shadow:0 16px 32px rgba(240,101,43,.34)}
  .btn:active{transform:scale(.99)}
  .tip{font-size:12px;color:var(--sub);margin:12px 0 0;text-align:center}

  /* ============ 2. 投篮 ============ */
  .dropzone{position:relative;width:100%;flex:0 0 auto;margin-top:6px;
    border:2px dashed var(--dash);border-radius:22px;padding:18px 16px 26px;
    display:flex;flex-direction:column;align-items:center;transition:background .25s ease,border-color .25s ease}
  .dropzone.ready{background:var(--orange-zone);border-color:var(--orange)}
  .drop-icon{color:#A9AEB6;margin-bottom:6px;transition:color .25s}
  .dropzone.ready .drop-icon{color:var(--orange)}
  .drop-title{font-size:16px;font-weight:600;letter-spacing:.01em}
  .drop-sub{font-size:12.5px;color:var(--sub);margin:6px 0 0}
  .hoop{position:relative;width:196px;margin:6px 0 -34px}
  .hoop svg{display:block;width:100%;height:auto;overflow:visible}

  /* 可拖拽的小卡（视频里的文件卡） */
  .file-card{
    position:absolute;z-index:6;left:46px;bottom:96px;width:98px;height:128px;cursor:grab;touch-action:none;
    transform-origin:center center;transition:transform .35s cubic-bezier(.2,.9,.25,1);
    filter:drop-shadow(0 12px 20px rgba(22,24,29,.14));
  }
  .file-card.dragging{cursor:grabbing;transition:none}
  .file-card .mini{width:100%;height:100%;background:#fff;border:1px solid var(--line);border-radius:13px;
    padding:10px 10px 8px;display:flex;flex-direction:column;gap:5px;position:relative;overflow:hidden}
  .mini .badge{position:absolute;bottom:7px;right:7px;font-size:7.5px;font-weight:600;letter-spacing:.04em;
    background:var(--orange);color:#fff;padding:2px 5px;border-radius:5px}
  .mini .mh{font-size:7px;letter-spacing:.1em;color:#AEB3BA;white-space:nowrap;overflow:hidden}
  .mini .mi{display:flex;gap:4px;align-items:flex-start;font-size:8.5px;line-height:1.35;color:#3A3F47;min-width:0}
  .mini .mi span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini .mi i{flex:0 0 auto;width:3px;height:3px;border-radius:50%;background:var(--orange);margin-top:4px}
  .mini .mfoot{margin-top:auto;font-size:7px;color:#B6BAC1;letter-spacing:.04em;padding-right:26px}
  .card-label{position:absolute;z-index:5;left:46px;bottom:72px;font-size:11px;color:var(--sub);white-space:nowrap}
  /* 飞行卡用的是"卡背"（卡通小动物），不是文字面 */
  .backface{position:relative;width:100%;height:100%;background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}
  .backface::after{content:"";position:absolute;inset:6px;border:1px dashed #E4E6EA;border-radius:8px;pointer-events:none}
  .bf-tag{position:absolute;top:9px;left:10px;font-size:6px;font-weight:600;letter-spacing:.05em;color:var(--orange)}
  .bf-sticker{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:56%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .bf-sticker svg{width:70%;height:auto}
  .bf-badge{position:absolute;left:10px;bottom:9px;font-size:6.5px;font-weight:600;color:#fff;background:var(--orange);padding:2px 4px;border-radius:4px;letter-spacing:.03em}
  .fx-canvas{position:absolute;inset:0;z-index:5;pointer-events:none;width:100%;height:100%}
  .shoot-foot{position:absolute;left:0;right:0;bottom:18px;z-index:6;display:flex;justify-content:center}
  .ghost{padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#6B7078;font-size:12.5px;cursor:pointer;transition:all .2s}
  .ghost:hover{border-color:var(--orange);color:var(--orange)}
  .view.uploaded .shoot-foot{opacity:0;pointer-events:none;transition:opacity .3s}

  .upload-row{position:absolute;z-index:7;left:8px;right:8px;bottom:14px;display:flex;align-items:center;gap:12px;
    background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);padding:12px 14px;
    opacity:0;transform:translateY(10px);transition:opacity .35s,transform .35s;pointer-events:none}
  .upload-row.show{opacity:1;transform:none}
  .u-icon{width:34px;height:42px;border-radius:7px;background:#fff;border:1px solid #E9EAEE;position:relative;flex:0 0 auto;box-shadow:0 3px 8px rgba(22,24,29,.06)}
  .u-icon::before{content:"";position:absolute;left:7px;right:7px;top:10px;height:1px;background:#E6E8EC;box-shadow:0 5px 0 #E6E8EC,0 10px 0 #E6E8EC}
  .u-icon .tag{position:absolute;left:4px;bottom:4px;background:var(--orange);color:#fff;font-size:6.5px;font-weight:700;padding:1px 3px;border-radius:4px}
  .u-main{flex:1;min-width:0}
  .u-name{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .u-meta{font-size:10.5px;color:var(--sub);margin-top:3px}
  .u-right{flex:0 0 auto;width:86px;text-align:right}
  .u-state{font-size:10.5px;color:var(--sub);margin-bottom:5px}
  .bar{height:4px;border-radius:99px;background:#EEF0F3;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--orange);transition:width .9s ease}
  .upload-row.show .bar i{width:100%}

  /* ============ 3. 卡池 ============ */
  .wall-wrap{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;margin-top:4px}
  .wall{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;
    align-items:start;align-content:start;padding-bottom:10px;scrollbar-width:none}
  .wall::-webkit-scrollbar{display:none}
  .wall-foot{margin-top:12px;display:flex;justify-content:center}
  .card{position:relative;aspect-ratio:3/4.1;perspective:900px;cursor:pointer;opacity:0;transform:translateY(14px) scale(.97)}
  html.still .card{opacity:1;transform:none}
  .card.enter{opacity:1;transform:none;transition:opacity .5s ease,transform .55s cubic-bezier(.2,.9,.25,1)}
  .card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.9,.25,1);border-radius:14px}
  .card.flipped .card-inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 8px 22px rgba(22,24,29,.10)}
  .face.back{background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .face.back::after{content:"";position:absolute;inset:7px;border:1px dashed #E4E6EA;border-radius:9px;pointer-events:none}
  .sticker{width:56%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:auto 0}
  .sticker svg{width:70%;height:auto}
  .back-tag{position:absolute;top:11px;left:12px;font-size:7px;font-weight:600;color:var(--orange);letter-spacing:.06em;z-index:2}
  .back-date{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:8px;color:#AEB3BA;letter-spacing:.1em}
  .face.front{transform:rotateY(180deg);background:#fff;border:1px solid var(--line);padding:11px 10px 9px;display:flex;flex-direction:column}
  .front .fdate{font-size:7.5px;letter-spacing:.12em;color:var(--orange);font-weight:600}
  .front ul{list-style:none;margin:7px 0 0;padding:0;flex:1;min-height:0;overflow:hidden}
  .front li{position:relative;padding-left:9px;font-size:9px;line-height:1.4;margin-bottom:4px;color:#3A3F47}
  .front li::before{content:"";position:absolute;left:0;top:4px;width:3px;height:3px;border-radius:50%;background:var(--orange)}
  .front .fauthor{display:flex;justify-content:space-between;align-items:center;font-size:7.5px;color:#AEB3BA;letter-spacing:.04em}
  .front .fauthor .star{color:var(--orange)}
  .tag-new{position:absolute;top:7px;right:7px;z-index:3;font-size:7px;font-weight:700;color:#fff;background:var(--orange);padding:2px 5px;border-radius:5px;letter-spacing:.04em}

  @media (max-height:760px){
    .hoop{width:168px;margin-bottom:-28px}
    .file-card{width:86px;height:112px;bottom:86px}
    .card-label{bottom:64px}
    .head{padding:20px 24px 10px}
    .head h1{font-size:24px}
  }

  /* ============ 放大查看（点卡片弹出） ============ */
  .modal{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s}
  .modal.open{opacity:1;visibility:visible}
  .modal-backdrop{position:absolute;inset:0;background:rgba(22,24,29,.4);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
  .modal-card{position:relative;width:min(330px,84vw);aspect-ratio:3/4.05;perspective:1300px;
    transform:translateY(14px) scale(.94);transition:transform .55s cubic-bezier(.2,.9,.25,1)}
  .modal.open .modal-card{transform:none}
  /* 翻牌放慢：整段 1.2s，前段抬起来一点，看得清翻转过程 */
  .modal-card .card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.3,.05,.25,1);border-radius:20px}
  .modal-card.flipped .card-inner{transform:rotateY(180deg)}
  .modal-card .face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.35);background:#fff;border:1px solid var(--line)}
  .modal-card .face.back{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  .modal-card .face.back::after{content:"";position:absolute;inset:10px;border:1px dashed #E4E6EA;border-radius:14px;pointer-events:none}
  .modal-card .back-tag{top:16px;left:18px;font-size:9px;letter-spacing:.08em}
  .modal-card .sticker{margin:auto 0;width:44%}
  .modal-card .back-date{bottom:18px;font-size:10px}
  .modal-card .tag-new{top:16px;right:16px;font-size:9px;padding:3px 8px}
  .modal-card .face.front{padding:22px 22px 18px;display:flex;flex-direction:column;transform:rotateY(180deg)}
  .modal-card .fdate{font-size:11px;letter-spacing:.14em}
  .modal-card .front ul{margin:14px 0 0;flex:1;min-height:0;overflow:auto;list-style:none;padding:0}
  .modal-card .front li{position:relative;padding-left:16px;font-size:14.5px;line-height:1.62;margin-bottom:12px;color:#2E333A}
  .modal-card .front li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--orange)}
  .modal-card .fauthor{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#AEB3BA;letter-spacing:.05em}
  .modal-card .fauthor .star{color:var(--orange);font-size:13px}
  .modal-close{padding:9px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.94);
    color:#3A3F47;font-size:12.5px;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.18);z-index:2}
  .modal-close:hover{border-color:var(--orange);color:var(--orange)}
  html.still .modal,html.still .modal-card,html.still .modal-card .card-inner{transition:none!important}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <div>
      <h1 id="headTitle">今天的三件好事</h1>
      <p class="sub" id="headSub">写下来，投进篮筐，收进你的卡池。</p>
    </div>
    <div class="pill">已收下 <b id="count">0</b></div>
  </header>

  <div class="main">
    <!-- 1. 写 -->
    <section class="view active" id="view-write">
      <div class="sheet">
        <label class="row"><span class="n">1</span><input value="食堂阿姨多给了一勺菜，还冲我笑了一下" /></label>
        <label class="row"><span class="n">2</span><input value="和室友把卡了两天的 bug 弄通了" /></label>
        <label class="row"><span class="n">3</span><input value="晚上去操场走了两圈，风很凉" /></label>
      </div>
      <button class="btn" id="toShoot">写好了 · 去投篮</button>
      <p class="tip">三条写满，投进篮筐，这张卡就进你的卡池</p>
    </section>

    <!-- 2. 投篮 -->
    <section class="view" id="view-shoot">
      <div class="dropzone" id="dropzone">
        <svg class="drop-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4"/><path d="M7 8l5-4 5 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
        </svg>
        <div class="drop-title">把卡拉满，投进篮筐</div>
        <p class="drop-sub">往后拉一点，松手，它会飞进去</p>
        <div class="hoop">
          <svg viewBox="0 0 200 200">
            <rect x="38" y="6" width="124" height="94" rx="6" fill="#fff" stroke="#EF6A32" stroke-width="4"/>
            <g id="rimGroup">
              <ellipse cx="100" cy="100" rx="40" ry="9.5" fill="none" stroke="#EF6A32" stroke-width="4"/>
            </g>
            <g id="net" stroke="#A9AEB6" stroke-width="1.6" fill="none"></g>
            <circle id="rimCenter" cx="100" cy="102" r="1" fill="transparent"/>
          </svg>
        </div>
      </div>

      <div class="file-card" id="fileCard"></div>
      <div class="card-label" id="cardLabel">今天的三件好事 · 11月16日</div>
      <canvas class="fx-canvas" id="fx"></canvas>

      <div class="shoot-foot"><button class="ghost" id="autoShoot">手不稳 · 自动投</button></div>

      <div class="upload-row" id="uploadRow">
        <div class="u-icon"><span class="tag">11·16</span></div>
        <div class="u-main">
          <div class="u-name">今天的三件好事</div>
          <div class="u-meta">3 条 · 刚刚</div>
        </div>
        <div class="u-right">
          <div class="u-state">正在收进卡池…</div>
          <div class="bar"><i></i></div>
        </div>
      </div>
    </section>

    <!-- 3. 卡池 -->
    <section class="view" id="view-wall">
      <div class="wall-wrap">
        <div class="wall" id="wall"></div>
        <div class="wall-foot"><button class="ghost" id="newCard">＋ 再写一张</button></div>
      </div>
    </section>
  </div>
</div>

<!-- 放大查看 -->
<div class="modal" id="modal">
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal-card" id="modalCard">
    <div class="card-inner">
      <div class="face back" id="modalBack"></div>
      <div class="face front" id="modalFront"></div>
    </div>
  </div>
  <button class="modal-close" id="modalClose">收起</button>
</div>

<script>
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- 卡背小动物（原创 SVG） ---------- */
  const ink = "#3B3F46";
  const BACKS = [
    { bg: "#FFE9DA", face: `<path d="M22 30 L14 12 L34 22 Z" fill="#FFF9F3" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/><path d="M58 30 L66 12 L46 22 Z" fill="#FFF9F3" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/><circle cx="40" cy="40" r="21" fill="#FFF9F3" stroke="${ink}" stroke-width="3"/><circle cx="32" cy="38" r="2.6" fill="${ink}"/><circle cx="48" cy="38" r="2.6" fill="${ink}"/><path d="M36 46 q4 4 8 0" fill="none" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/><path d="M14 40 L24 42 M14 48 L24 47 M66 40 L56 42 M66 48 L56 47" stroke="${ink}" stroke-width="2" stroke-linecap="round" opacity=".65"/>` },
    { bg: "#E3EDFF", face: `<ellipse cx="22" cy="42" rx="9" ry="16" fill="#F7FAFF" stroke="${ink}" stroke-width="3" transform="rotate(-16 22 42)"/><ellipse cx="58" cy="42" rx="9" ry="16" fill="#F7FAFF" stroke="${ink}" stroke-width="3" transform="rotate(16 58 42)"/><circle cx="40" cy="40" r="20" fill="#F7FAFF" stroke="${ink}" stroke-width="3"/><circle cx="33" cy="37" r="2.5" fill="${ink}"/><circle cx="47" cy="37" r="2.5" fill="${ink}"/><ellipse cx="40" cy="47" rx="8" ry="6" fill="#FFF" stroke="${ink}" stroke-width="2"/><ellipse cx="40" cy="44" rx="3" ry="2.2" fill="${ink}"/>` },
    { bg: "#E2F3E6", face: `<circle cx="40" cy="38" r="20" fill="#F7FCF8" stroke="${ink}" stroke-width="3"/><circle cx="30" cy="24" r="7" fill="#F7FCF8" stroke="${ink}" stroke-width="3"/><circle cx="50" cy="24" r="7" fill="#F7FCF8" stroke="${ink}" stroke-width="3"/><circle cx="31" cy="38" r="2.6" fill="${ink}"/><circle cx="49" cy="38" r="2.6" fill="${ink}"/><path d="M28 47 q12 9 24 0" fill="none" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/><ellipse cx="24" cy="47" rx="3.2" ry="2" fill="#F3A6A6" opacity=".75"/><ellipse cx="56" cy="47" rx="3.2" ry="2" fill="#F3A6A6" opacity=".75"/>` },
    { bg: "#FFE3E9", face: `<ellipse cx="28" cy="20" rx="6" ry="15" fill="#FFF6F8" stroke="${ink}" stroke-width="3"/><ellipse cx="52" cy="20" rx="6" ry="15" fill="#FFF6F8" stroke="${ink}" stroke-width="3"/><circle cx="40" cy="40" r="20" fill="#FFF6F8" stroke="${ink}" stroke-width="3"/><circle cx="33" cy="38" r="2.5" fill="${ink}"/><circle cx="47" cy="38" r="2.5" fill="${ink}"/><ellipse cx="40" cy="46" rx="3" ry="2.4" fill="#E8899C"/><path d="M34 50 q6 5 12 0" fill="none" stroke="${ink}" stroke-width="2.2" stroke-linecap="round"/>` },
    { bg: "#EEE7FF", face: `<circle cx="27" cy="24" r="8" fill="#FAF7FF" stroke="${ink}" stroke-width="3"/><circle cx="53" cy="24" r="8" fill="#FAF7FF" stroke="${ink}" stroke-width="3"/><circle cx="40" cy="40" r="21" fill="#FAF7FF" stroke="${ink}" stroke-width="3"/><circle cx="33" cy="39" r="2.6" fill="${ink}"/><circle cx="47" cy="39" r="2.6" fill="${ink}"/><ellipse cx="40" cy="47" rx="6.5" ry="5" fill="#FFF" stroke="${ink}" stroke-width="2"/><ellipse cx="40" cy="44.5" rx="2.6" ry="2" fill="${ink}"/>` },
    { bg: "#FFF0DA", face: `<circle cx="40" cy="40" r="21" fill="#FFFAF2" stroke="${ink}" stroke-width="3"/><circle cx="32" cy="37" r="2.6" fill="${ink}"/><circle cx="48" cy="37" r="2.6" fill="${ink}"/><path d="M40 43 L35 49 L45 49 Z" fill="#F6A55C" stroke="${ink}" stroke-width="2.2" stroke-linejoin="round"/><ellipse cx="24" cy="45" rx="3.2" ry="2" fill="#F3A6A6" opacity=".8"/><ellipse cx="56" cy="45" rx="3.2" ry="2" fill="#F3A6A6" opacity=".8"/>` }
  ];
  const backSVG = i => `<svg viewBox="0 0 80 80">${BACKS[i % BACKS.length].face}</svg>`;

  /* ---------- 数据 ---------- */
  const OTHERS = [
    { author: "小鹿", date: "11月15日", items: ["睡到自然醒", "妈妈寄的围巾到了", "晚霞很好看"] },
    { author: "番茄", date: "11月15日", items: ["抢到演唱会门票", "楼下新开的面馆好吃", "和猫对视了三秒"] },
    { author: "阿北", date: "11月14日", items: ["把房间收拾干净", "看完一部老电影", "散步遇到一只狗"] },
    { author: "momo", date: "11月14日", items: ["雅思听力全对", "食堂排到最后一份鱼", "朋友说想我了"] },
    { author: "老白", date: "11月13日", items: ["实验终于跑通", "室友煮了面", "把 to-do 清掉一半"] },
    { author: "柚子", date: "11月13日", items: ["睡了个好觉", "随机到很喜欢的歌", "窗台植物冒新芽"] },
    { author: "小满", date: "11月12日", items: ["被老师夸了一句", "买到热乎乎的烤红薯", "把想说的话说出口了"] },
    { author: "阿蓝", date: "11月12日", items: ["写完拖了三天的邮件", "午后太阳很好", "晚饭吃到最喜欢的菜"] },
    { author: "橘子", date: "11月11日", items: ["和朋友视频很久", "把衣服都晒了", "学会一个新和弦"] }
  ];
  let collection = OTHERS.slice();
  let count = 0;

  /* ---------- 视图 ---------- */
  const views = { write: "#view-write", shoot: "#view-shoot", wall: "#view-wall" };
  function show(name) {
    if (!views[name]) name = "write";
    $$(".view").forEach(v => v.classList.toggle("active", "#" + v.id === views[name]));
    if (history.replaceState) history.replaceState(null, "", "#" + name);
    if (name === "wall") renderWall();
    if (name === "shoot") { resetShoot(); shoot.active = true; shoot.refit(); }
    else shoot.active = false;
    $("#headTitle").textContent = name === "wall" ? "卡池" : "今天的三件好事";
    $("#headSub").textContent = name === "wall" ? "每张背面朝上的卡，都藏着三条好事"
      : (name === "shoot" ? "把这张卡投进篮筐，我们就收下今天。" : "写下来，投进篮筐，收进你的卡池。");
  }
  $("#toShoot").addEventListener("click", () => show("shoot"));
  $("#newCard").addEventListener("click", () => show("write"));

  /* ================= 投篮 ================= */
  const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const quad = (p0, p1, p2, t) => ({
    x: (1 - t) * (1 - t) * p0.x + 2 * (1 - t) * t * p1.x + t * t * p2.x,
    y: (1 - t) * (1 - t) * p0.y + 2 * (1 - t) * t * p1.y + t * t * p2.y
  });

  const shoot = {
    active: false, dragging: false, flying: false, overZone: false,
    sx: 0, sy: 0, dx: 0, dy: 0, vy: 0, lastY: 0, lastT: 0,
    cardEl: null, fx: null, ctx: null, zoneEl: null, rimEl: null,
    trails: [], guideT: 0, swishT: -1, rimT: -1, baseNet: [],
    init() {
      this.cardEl = $("#fileCard");
      this.fx = $("#fx");
      this.zoneEl = $("#dropzone");
      this.rimEl = $("#rimCenter");
      this.cardEl.innerHTML = miniCardHTML();
      this.buildNet();
      this.bind();
      this.loop();
    },
    refit() { this.ctx = fit(this.fx); },
    /* 网兜：6 根主线 + 3 道横环，全部由 JS 画，方便逐条摆动 */
    buildNet() {
      const g = $("#net");
      const rimY = 100, rimL = 60, rimR = 140, botY = 168;
      const strands = [];
      for (let i = 0; i <= 6; i++) {
        const x1 = rimL + (rimR - rimL) * (i / 6);
        const x2 = 100 + (i - 3) * 9;
        strands.push({ x1, x2, phase: i * 1.1, el: document.createElementNS("http://www.w3.org/2000/svg", "path") });
      }
      const rings = [];
      for (let k = 1; k <= 3; k++) {
        const cy = rimY + k * 20;
        rings.push({ cy, rx: 40 - k * 6, phase: k * 2, el: document.createElementNS("http://www.w3.org/2000/svg", "path") });
      }
      this.baseNet = { rimY, rimL, rimR, botY, strands, rings, g };
      [...strands, ...rings].forEach(o => g.appendChild(o.el));
      this.renderNet(0);
    },
    renderNet(amp) {
      const n = this.baseNet, t = performance.now() / 1000;
      n.strands.forEach(s => {
        const px = (s.x1 + s.x2) / 2 + amp * 16 * Math.sin(t * 13 + s.phase);
        const py = (n.rimY + n.botY) / 2 + amp * 8;
        s.el.setAttribute("d", `M${s.x1} ${n.rimY} Q${px} ${py} ${s.x2} ${n.botY}`);
      });
      n.rings.forEach(r => {
        const dy = amp * 7 * Math.sin(t * 14 + r.phase);
        r.el.setAttribute("d", `M${100 - r.rx} ${r.cy} Q100 ${r.cy + dy} ${100 + r.rx} ${r.cy}`);
      });
    },
    bind() {
      const el = this.cardEl;
      el.addEventListener("pointerdown", e => {
        if (this.flying) return;
        el.setPointerCapture?.(e.pointerId);
        this.dragging = true;
        this.sx = e.clientX; this.sy = e.clientY;
        this.dx = 0; this.dy = 0;
        this.lastY = e.clientY; this.lastT = performance.now(); this.vy = 0;
        el.classList.add("dragging");
      });
      el.addEventListener("pointermove", e => {
        if (!this.dragging) return;
        this.dx = clamp(e.clientX - this.sx, -28, 80);
        this.dy = clamp(e.clientY - this.sy, -150, 100);
        const now = performance.now();
        const dt = Math.max(8, now - this.lastT);
        this.vy = (e.clientY - this.lastY) / dt * 1000;
        this.lastY = e.clientY; this.lastT = now;
        el.style.transform = `translate(${this.dx}px,${this.dy}px) rotate(${this.dx * .06}deg) scale(${1 - Math.min(.06, Math.hypot(this.dx, this.dy) / 900)})`;
        this.checkZone();
      });
      const end = () => {
        if (!this.dragging) return;
        this.dragging = false;
        el.classList.remove("dragging");
        this.zoneEl.classList.remove("ready");
        const pull = Math.hypot(this.dx, this.dy);
        if (pull > 42) this.shoot();       /* 拉够了 → 松手发射 */
        else { el.style.transform = "translate(0,0)"; this.overZone = false; }  /* 拉太短 → 弹回 */
      };
      el.addEventListener("pointerup", end);
      el.addEventListener("pointercancel", end);
      $("#autoShoot").addEventListener("click", () => {
        if (this.flying) return;
        el.style.transform = "translate(0,0)";
        this.overZone = true;
        this.shoot();
      });
    },
    checkZone() {
      const c = this.cardEl.getBoundingClientRect();
      const z = this.zoneEl.getBoundingClientRect();
      const cx = c.left + c.width / 2, cy = c.top + c.height / 2;
      this.overZone = cx > z.left && cx < z.right && cy > z.top && cy < z.bottom;
      this.zoneEl.classList.toggle("ready", this.overZone);
    },
    path() {
      const c = this.cardEl.getBoundingClientRect();
      const r = this.rimEl.getBoundingClientRect();
      const p0 = { x: c.left + c.width / 2, y: c.top + c.height / 2 };
      const p2 = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      /* 拉得越远，弧线越高（弹弓的力度） */
      const pull = Math.hypot(this.dx, this.dy);
      const p1 = { x: (p0.x + p2.x) / 2, y: Math.min(p0.y, p2.y) - 150 - pull * .38 };
      return { p0, p1, p2, pull };
    },
    /* 虚线弧：由一小段一小段的线画出来，越靠两端越淡 */
    drawDashes(box) {
      const { p0, p1, p2 } = this.path();
      const c = this.ctx;
      if (!c) return;
      const N = 72;
      let prev = quad(p0, p1, p2, 0), dist = 0;
      c.lineCap = "round";
      c.lineWidth = 2;
      for (let i = 1; i <= N; i++) {
        const t = i / N;
        const p = quad(p0, p1, p2, t);
        dist += Math.hypot(p.x - prev.x, p.y - prev.y);
        if (dist % 13 < 6.6) {
          const a = .78 - Math.abs(t - .5) * .55;
          c.strokeStyle = `rgba(240,101,43,${a.toFixed(2)})`;
          c.beginPath();
          c.moveTo(prev.x - box.left, prev.y - box.top);
          c.lineTo(p.x - box.left, p.y - box.top);
          c.stroke();
        }
        prev = p;
      }
    },
    shoot() {
      if (this.flying) return;
      this.flying = true;
      this.overZone = false;
      const { p0, p1, p2 } = this.path();
      const el = this.cardEl;
      const t0 = performance.now(), dur = 700;
      let lastDot = 0;
      const step = now => {
        const t = clamp((now - t0) / dur, 0, 1);
        const e = easeInOut(t);
        const pos = quad(p0, p1, p2, e);
        const s = 1 - .38 * e;
        el.style.transform = `translate(${(pos.x - p0.x).toFixed(1)}px,${(pos.y - p0.y).toFixed(1)}px) rotate(${(e * 210).toFixed(0)}deg) scale(${s.toFixed(3)})`;
        if (now - lastDot > 42 && t < .92) { lastDot = now; this.addTrail(pos.x, pos.y); }
        if (t > .9 && this.swishT < 0) this.swish();
        if (t < 1) requestAnimationFrame(step);
        else this.finish();
      };
      requestAnimationFrame(step);
    },
    swish() {
      const box = this.fx.getBoundingClientRect();
      const r = this.rimEl.getBoundingClientRect();
      const rx = r.left + r.width / 2 - box.left, ry = r.top + r.height / 2 - box.top;
      this.swishT = performance.now();
      this.rimT = performance.now();
      this.renderNet(1);
      for (let i = 0; i < 18; i++) {
        const a = Math.random() * Math.PI * 2, sp = 30 + Math.random() * 120;
        this.trails.push({ x: rx, y: ry, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp + 60, age: 0, life: .5 + Math.random() * .4, r: 2.2 + Math.random() * 2.6, kind: "burst" });
      }
      sound.swish();
    },
    addTrail(x, y) {
      if (RM) return;
      this.trails.push({ x, y, vx: 0, vy: 0, age: 0, life: .85, r: 3 + Math.random() * 2, kind: "dot" });
    },
    loop() {
      requestAnimationFrame(() => this.loop());
      if (!this.active) return;
      if (this.freeze) return;
      const c = this.ctx, cv = this.fx;
      if (!c) return;
      c.clearRect(0, 0, cv._w, cv._h);
      const box = this.fx.getBoundingClientRect();

      /* 拖拽时：虚线轨迹预览（拉得越远弧线越高） */
      if (this.dragging) this.drawDashes(box);

      /* 飞行拖尾 + 入网碎点 */
      for (let i = this.trails.length - 1; i >= 0; i--) {
        const p = this.trails[i];
        p.age += 1 / 60;
        if (p.age > p.life) { this.trails.splice(i, 1); continue; }
        p.x += p.vx / 60; p.y += p.vy / 60;
        const a = Math.max(0, 1 - p.age / p.life);
        c.fillStyle = `rgba(240,101,43,${(p.kind === "burst" ? .9 : .8) * a})`;
        c.beginPath();
        c.arc(p.x - box.left, p.y - box.top, p.r * (p.kind === "burst" ? a : 1), 0, Math.PI * 2);
        c.fill();
      }

      /* 篮圈下压回弹 + 网兜摆动 */
      if (this.rimT > 0) {
        const dt = (performance.now() - this.rimT) / 1000;
        const k = dt < 2 ? Math.exp(-3.4 * dt) * Math.sin(dt * 16) : 0;
        $("#rimGroup").style.transform = `translateY(${(6 * k).toFixed(2)}px)`;
        this.renderNet(Math.max(0, k));
        if (dt > 1.6) { this.rimT = -1; $("#rimGroup").style.transform = ""; this.renderNet(0); }
      }
    },
    finish() {
      this.flying = false;
      this.swishT = -1;
      this.cardEl.style.opacity = "0";
      $("#view-shoot").classList.add("uploaded");
      $("#uploadRow").classList.add("show");
      count += 1;
      $("#count").textContent = count;
      collection.unshift({ author: "你", date: "11月16日", items: readItems() });
      setTimeout(() => {
        this.cardEl.style.opacity = "";
        this.cardEl.style.transform = "translate(0,0)";
        this.trails = [];
        this.renderNet(0);
        show("wall");
      }, 1250);
    }
  };

  function fit(cv) {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    cv._w = r.width || 400; cv._h = r.height || 600;
    const ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return ctx;
  }
  function readItems() { return $$("#view-write .row input").map(i => i.value.trim()).filter(Boolean); }
  function miniCardHTML() {
    const idx = collection.length % BACKS.length;
    const b = BACKS[idx];
    return `<div class="backface">
      <span class="bf-tag">THREE GOOD THINGS</span>
      <div class="bf-sticker" style="background:${b.bg}">${backSVG(idx)}</div>
      <span class="bf-badge">11·16</span>
    </div>`;
  }
  function resetShoot() {
    shoot.dragging = false; shoot.flying = false; shoot.overZone = false;
    shoot.trails = []; shoot.swishT = -1; shoot.rimT = -1;
    shoot.cardEl.style.transform = "translate(0,0)";
    shoot.cardEl.style.opacity = "";
    shoot.cardEl.innerHTML = miniCardHTML();
    $("#cardLabel").textContent = "今天的三件好事 · 11月16日";
    $("#cardLabel").style.opacity = "";
    $("#dropzone").classList.remove("ready");
    $("#view-shoot").classList.remove("uploaded");
    $("#uploadRow").classList.remove("show");
    $("#rimGroup").style.transform = "";
    shoot.renderNet(0);
  }

  /* ================= 卡池 ================= */
  function cardHTML(d, i) {
    const b = BACKS[i % BACKS.length];
    return `<div class="card" data-i="${i}">
      <div class="card-inner">
        <div class="face back">
          <span class="back-tag">THREE GOOD THINGS</span>
          ${d.author === "你" && i === 0 ? '<span class="tag-new">刚投进</span>' : ""}
          <div class="sticker" style="background:${b.bg}">${backSVG(i)}</div>
          <div class="back-date">${d.date}</div>
        </div>
        <div class="face front">
          <div class="fdate">${d.date}</div>
          <ul>${d.items.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
          <div class="fauthor"><span>@${esc(d.author)}</span><span class="star">★</span></div>
        </div>
      </div>
    </div>`;
  }
  /* ---- 放大查看 ---- */
  function openCard(i, instant) {
    const d = collection[i];
    if (!d) return;
    const b = BACKS[i % BACKS.length];
    $("#modalBack").innerHTML = `<span class="back-tag">THREE GOOD THINGS</span>
      ${d.author === "你" && i === 0 ? '<span class="tag-new">刚投进</span>' : ""}
      <div class="sticker" style="background:${b.bg}">${backSVG(i)}</div>
      <div class="back-date">${d.date}</div>`;
    $("#modalFront").innerHTML = `<div class="fdate">${d.date}</div>
      <ul>${d.items.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      <div class="fauthor"><span>@${esc(d.author)}</span><span class="star">★</span></div>`;
    const mc = $("#modalCard");
    mc.classList.remove("flipped");
    $("#modal").classList.add("open");
    if (instant) { mc.classList.add("flipped"); }
    else {
      /* 先让卡稳稳出现在画面里，再开始慢慢翻 */
      setTimeout(() => { mc.classList.add("flipped"); sound.flip(); }, 460);
    }
  }
  function closeCard() { $("#modal").classList.remove("open"); }
  $("#modalClose").addEventListener("click", closeCard);
  $("#modalBackdrop").addEventListener("click", closeCard);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeCard(); });

  function renderWall() {
    const wall = $("#wall");
    wall.innerHTML = collection.map((d, i) => cardHTML(d, i)).join("");
    const cards = $$(".card", wall);
    cards.forEach((el, i) => {
      if (RM) { el.classList.add("enter"); return; }
      el.style.transitionDelay = `${Math.min(i, 12) * 40}ms`;
      requestAnimationFrame(() => el.classList.add("enter"));
    });
    cards.forEach((el, i) => el.addEventListener("click", () => openCard(i)));
  }

  /* ================= 声音 ================= */
  let AC = null;
  const sound = {
    ctx() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); return AC; } catch (e) { return null; } },
    tone(f, d, g, type = "sine") {
      const a = this.ctx(); if (!a) return;
      const t0 = a.currentTime + d;
      const o = a.createOscillator(), gn = a.createGain();
      o.type = type; o.frequency.value = f;
      gn.gain.setValueAtTime(0, t0);
      gn.gain.linearRampToValueAtTime(g, t0 + .012);
      gn.gain.exponentialRampToValueAtTime(.0001, t0 + .45);
      o.connect(gn).connect(a.destination); o.start(t0); o.stop(t0 + .5);
    },
    flip() { this.tone(1240, 0, .03, "triangle"); },
    swish() {
      const a = this.ctx(); if (!a) return;
      const len = Math.floor(a.sampleRate * .42);
      const buf = a.createBuffer(1, len, a.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4);
      const src = a.createBufferSource(); src.buffer = buf;
      const bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1500; bp.Q.value = .7;
      const g = a.createGain(); g.gain.value = .05;
      src.connect(bp).connect(g).connect(a.destination); src.start();
      this.tone(600, .04, .03); this.tone(900, .09, .02);
    }
  };
  function esc(s) { return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }

  /* ================= 启动 ================= */
  shoot.init();
  addEventListener("resize", () => {
    shoot.ctx = fit(shoot.fx);
    if (shoot.freeze) shoot.drawDashes(shoot.fx.getBoundingClientRect());
  });

  const hashParts = (location.hash || "#write").slice(1).split("&");
  if (hashParts.includes("still")) document.documentElement.classList.add("still");
  const start = hashParts[0] || "write";
  show(["shoot", "wall"].includes(start) ? start : "write");

  const flipArg = hashParts.find(p => p.startsWith("open="));
  if (start === "wall" && flipArg) {
    openCard(parseInt(flipArg.split("=")[1], 10) || 0, true);
  }
  /* &drag：定格"正在拖拽"的样子（虚线预览 + 框高亮）；&frozen=0.6 定格飞行 */
  const dragArg = hashParts.includes("drag");
  if (start === "shoot" && dragArg) {
    shoot.dragging = true;
    shoot.overZone = true;
    shoot.dx = -74; shoot.dy = 52;
    $("#dropzone").classList.add("ready");
    shoot.cardEl.style.transform = "translate(-74px,52px) rotate(-4deg) scale(.97)";
  }
  const frozenArg = hashParts.find(p => p.startsWith("frozen="));
  if (start === "shoot" && frozenArg && !RM) {
    const f = clamp(parseFloat(frozenArg.split("=")[1]) || .6, 0, 1);
    shoot.refit();
    shoot.freeze = true;
    shoot.dx = 0; shoot.dy = 0;
    const { p0, p1, p2 } = shoot.path();
    const e = easeInOut(f);
    const pos = quad(p0, p1, p2, e);
    shoot.cardEl.style.transform = `translate(${(pos.x - p0.x).toFixed(1)}px,${(pos.y - p0.y).toFixed(1)}px) rotate(${(e * 210).toFixed(0)}deg) scale(${(1 - .38 * e).toFixed(3)})`;
    const box = shoot.fx.getBoundingClientRect();
    shoot.ctx.clearRect(0, 0, shoot.fx._w, shoot.fx._h);
    shoot.drawDashes(box);
  }
})();
</script>
